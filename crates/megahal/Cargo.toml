[package]
name = "rcbot_megahal"
description = "RCBot's MegaHAL and bot_chat.ini as an AMX Mod X module (rcbot_megahal)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# xtask renames the output to AMX Mod X's file names (rcbot_megahal_amxx_i386.so, rcbot_megahal_amxx.dll).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amxx.workspace = true
rcbot.workspace = true
rcbot-amxx-common.workspace = true

[lints.rust]
unsafe_code = "deny"
